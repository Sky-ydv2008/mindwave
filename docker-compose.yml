version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mindwave-postgres
    environment:
      POSTGRES_USER: mindwave
      POSTGRES_PASSWORD: mindwave_secret_password
      POSTGRES_DB: mindwave_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindwave -d mindwave_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mindwave-redis
    ports:
      - "6379:6379"

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: mindwave-server
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://mindwave:mindwave_secret_password@postgres:5432/mindwave_db?schema=public
      JWT_SECRET: mindwave_jwt_secret_key_super_secure_2026
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: mindwave-web
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  postgres_data:
